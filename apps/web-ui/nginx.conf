server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 채팅 API는 게이트웨이로 넘긴다 (M5 이후에는 ingress가 /api 를 직접 라우팅)
    location /api/ {
        proxy_pass http://ax-gateway:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;   # CPU 추론은 응답이 느리다
    }

    location = /healthz { return 200 "ok\n"; }
}
