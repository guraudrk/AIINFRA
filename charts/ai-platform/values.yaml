# AX Platform Lab — ai-platform 차트 기본값
# GPU 모드: SIMULATED(kind + fake-gpu) 기준. docs/00-environment.md 참고

# GPU 노드 배치 공통 설정: 라벨로 끌어당기고(nodeSelector) taint를 허용(toleration)
gpuNode:
  nodeSelector:
    node-role: gpu
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule

# ── sLLM 서빙 ───────────────────────────────────────────────
llmServing:
  enabled: true
  engine: ollama            # ollama | vllm (vllm은 REAL GPU 전용, 이 PC에서는 미검증)
  image: ollama/ollama:0.40.0
  model: qwen2.5:3b         # Q4_K_M, 파일 약 1.9GB, 한국어 가능
  numParallel: 4            # 동시에 처리할 요청 수 (슬롯마다 KV 캐시를 따로 잡는다)
  contextLength: 4096       # 요청당 최대 컨텍스트 토큰
  gpu: 1                    # nvidia.com/gpu 개수 (SIMULATED에서는 스케줄링에만 쓰이고 실제 추론은 CPU)
  storage: 10Gi             # 모델 캐시 PVC
  # 메모리 계산 근거 (qwen2.5:3b, Q4_K_M):
  #   가중치        ≈ 3.1B 파라미터 × 약 0.6바이트(Q4_K_M 평균)  ≈ 1.9 GB
  #   KV 캐시/토큰  = 2(K,V) × 36레이어 × 2(KV헤드) × 128(헤드차원) × 2바이트(FP16) ≈ 36 KB
  #   KV 캐시 합계  ≈ 36 KB × 4096 컨텍스트 × 4 슬롯 ≈ 0.6 GB
  #   런타임 여유   ≈ 0.5 GB  →  합계 약 3.0 GB = requests, 순간 피크 대비 limits 4Gi
  resources:
    requests:
      cpu: "2"
      memory: 3Gi
    limits:
      cpu: "6"
      memory: 4Gi
  # engine: vllm 일 때만 사용 (OpenAI 호환 API, 포트 8000)
  vllm:
    image: vllm/vllm-openai:latest
    model: Qwen/Qwen2.5-3B-Instruct-AWQ
    maxModelLen: 4096
    gpuMemoryUtilization: 0.85

# ── 임베딩 서빙 ─────────────────────────────────────────────
embeddingServing:
  enabled: true
  image: ollama/ollama:0.40.0
  model: bge-m3             # 568M 파라미터, 1024차원, 다국어, F16 파일 약 1.2GB
  dimensions: 1024          # pgvector 컬럼 차원과 반드시 같아야 한다 (M3)
  numParallel: 2
  gpu: 1
  storage: 5Gi
  # 메모리 계산 근거: 가중치 568M × 2바이트(F16) ≈ 1.2 GB + 배치·런타임 여유 0.3 GB ≈ 1.5 GB
  resources:
    requests:
      cpu: "1"
      memory: 1536Mi
    limits:
      cpu: "4"
      memory: 2560Mi

# ── 데이터 노드 배치 공통 설정 ───────────────────────────────
dataNode:
  nodeSelector:
    node-role: data
  tolerations:
    - key: dedicated
      operator: Equal
      value: data
      effect: NoSchedule

# ── PostgreSQL + pgvector ───────────────────────────────────
# 비밀번호는 scripts/create-secrets.sh 가 만든 Secret(postgres-credentials)에서 읽는다
postgres:
  enabled: true
  image: pgvector/pgvector:pg17
  database: hanbit
  storage: 5Gi
  resources:
    requests: { cpu: 250m, memory: 256Mi }
    limits:   { cpu: "2",  memory: 1Gi }

# ── MinIO (S3 호환 오브젝트 스토리지) ───────────────────────
# 커뮤니티 공식 이미지 배포가 중단돼, 소스 빌드 이미지(Chainguard)를 digest로 고정한다
minio:
  enabled: true
  image: cgr.dev/chainguard/minio@sha256:e7ca559d9f7c0b5f24f5f669bb92f40f3ca88d56273b808bf3a7c116c17d2ffa
  storage: 10Gi
  buckets: [raw-docs, backups]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits:   { cpu: "1",  memory: 1Gi }

# ── 수집 파이프라인 (apps/ingest) ───────────────────────────
ingest:
  enabled: true
  image: ax/ingest:0.1.1          # 로컬 빌드 후 kind load (scripts/build-images.sh)
  schedule: "*/30 * * * *"        # 변경분 재수집 주기
  chunkSize: 700                  # 청크 최대 글자 수
  chunkOverlap: 100               # 청크끼리 겹치는 글자 수
  embedBatch: 16

# ── 사내 AI 게이트웨이 (apps/ax-gateway) ────────────────────
axGateway:
  enabled: true
  image: ax/ax-gateway:0.1.3
  replicas: 1
  agentMode: rules           # rules(규칙 기반 라우팅 + LLM 요약) | llm(LLM 도구 호출)
  appFilterEnabled: true     # (a) 앱 권한 필터. false여도 (b) DB RLS가 막는다
  topK: 5
  # 코사인 거리 상한: 이보다 먼 청크는 근거로 쓰지 않음 ("모른다" 판단)
  # 실측(M4): 관련 질문 0.37~0.55, 무관한 질문 0.58~0.67 → 그 사이 0.56
  maxDistance: 0.56
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits:   { cpu: "1",  memory: 512Mi }
  hpa:
    minReplicas: 1
    maxReplicas: 3
    cpuUtilization: 70

# ── 채팅 화면 (apps/web-ui) ─────────────────────────────────
webUi:
  enabled: true
  image: ax/web-ui:0.1.0

# ── 단일 입구 (M5) ──────────────────────────────────────────
ingress:
  enabled: true
  className: traefik
  clusterIssuer: hanbit-ca      # infra/tls/issuers.yaml
  hosts:
    - localhost
    - ax.hanbit.local           # 사내 DNS 이름 가정 (Windows hosts 파일에 등록하면 사용 가능)

# ── 네트워크 정책 (M5) ──────────────────────────────────────
networkPolicy:
  enabled: true
  ingressNamespace: traefik       # 외부 입구(Ingress 컨트롤러)가 있는 네임스페이스
  monitoringNamespace: monitoring # M6 Prometheus가 지표를 수집할 네임스페이스

# ── 모니터링 (M6): kube-prometheus-stack은 infra/monitoring-values.yaml 로 별도 설치 ──
monitoring:
  enabled: true
  runbookBase: runbooks/alerts.md          # 알람의 runbook_url (저장소 내 대응 문서)
  gpuSimExporter:
    image: ax/gpu-sim-exporter:0.1.0       # SIMULATED 모드. REAL이면 NVIDIA dcgm-exporter(GPU Operator)로 대체
  postgresExporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1

# ── 백업 (M7) ───────────────────────────────────────────────
backup:
  enabled: true
  schedule: "0 2 * * *"      # 매일 02:00 (UTC 기준 kind 노드 시간)
  bucket: backups
  keep: 7                    # 최근 7개 보관 (일 1회면 7일치)
