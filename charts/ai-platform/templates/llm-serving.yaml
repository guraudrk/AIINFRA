{{- if and .Values.llmServing.enabled (eq .Values.llmServing.engine "ollama") }}
{{- $c := .Values.llmServing }}
# 모델 캐시: Pod가 재시작돼도 모델을 다시 받지 않도록 PVC에 저장
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-serving-models
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $c.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serving
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  replicas: 1
  progressDeadlineSeconds: 1800   # 첫 모델 적재가 10분(기본값)을 넘을 수 있다
  strategy:
    type: Recreate          # RWO PVC + GPU 1개라 새 Pod와 옛 Pod가 동시에 뜰 수 없다
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-serving
    spec:
      {{- include "ai-platform.gpuPlacement" . | nindent 6 }}
      containers:
        - name: ollama
          image: {{ $c.image }}
          ports:
            - name: http
              containerPort: 11434
          env:
            - name: OLLAMA_HOST
              value: "0.0.0.0:11434"
            - name: OLLAMA_NUM_PARALLEL
              value: {{ $c.numParallel | quote }}
            - name: OLLAMA_CONTEXT_LENGTH
              value: {{ $c.contextLength | quote }}
            - name: OLLAMA_KEEP_ALIVE
              value: "-1"           # 모델을 메모리에 계속 올려 둠 (첫 요청 지연 방지)
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
            - name: MODEL_NAME
              value: {{ $c.model | quote }}
          resources:
            requests:
              {{- toYaml $c.resources.requests | nindent 14 }}
            limits:
              {{- toYaml $c.resources.limits | nindent 14 }}
              nvidia.com/gpu: {{ $c.gpu }}   # 확장 리소스는 limits만 쓰면 requests도 같은 값
          # startup: 서버 프로세스가 뜰 때까지 (이 동안 liveness는 검사하지 않음)
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
            failureThreshold: 60
          # readiness: 모델이 PVC에 있어야 트래픽을 받는다 (preload 전에는 NotReady)
          readinessProbe:
            exec:
              command: ["sh", "-c", "ollama show \"$MODEL_NAME\" >/dev/null"]
            periodSeconds: 10
            timeoutSeconds: 5
          # liveness: 서버가 응답하지 않으면 재시작
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-serving-models
---
apiVersion: v1
kind: Service
metadata:
  name: llm-serving
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  selector:
    app.kubernetes.io/name: llm-serving
  ports:
    - name: http
      port: 11434
      targetPort: http
---
# 관리용 Service: 모델 적재(preload)처럼 Pod가 Ready가 되기 "전"에 접근해야 하는 작업 전용.
# 일반 Service는 Ready Pod에만 연결하므로, readiness가 "모델 있음"을 검사하면 적재 요청이 영원히 못 들어간다.
apiVersion: v1
kind: Service
metadata:
  name: llm-serving-admin
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  clusterIP: None                  # headless: DNS가 Pod IP를 바로 돌려준다
  publishNotReadyAddresses: true   # NotReady Pod도 주소에 포함
  selector:
    app.kubernetes.io/name: llm-serving
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- end }}
