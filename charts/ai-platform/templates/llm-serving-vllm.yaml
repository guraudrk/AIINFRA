{{- /*
  vLLM 옵션 (engine: vllm). REAL GPU 노드 전용 — 이 PC(SIMULATED)에서는 동작 미검증.
  OpenAI 호환 API(/v1/chat/completions)를 8000 포트로 제공하고, Service는 11434로 노출해
  다른 컴포넌트가 엔진 종류와 무관하게 llm-serving:11434 로 접속하게 한다.
*/ -}}
{{- if and .Values.llmServing.enabled (eq .Values.llmServing.engine "vllm") }}
{{- $c := .Values.llmServing }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: llm-serving-models
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: {{ $c.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-serving
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llm-serving
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llm-serving
    spec:
      {{- include "ai-platform.gpuPlacement" . | nindent 6 }}
      containers:
        - name: vllm
          image: {{ $c.vllm.image }}
          args:
            - --model={{ $c.vllm.model }}
            - --served-model-name={{ $c.model }}
            - --max-model-len={{ $c.vllm.maxModelLen }}
            - --gpu-memory-utilization={{ $c.vllm.gpuMemoryUtilization }}
          env:
            - name: HF_HOME
              value: /models
          ports:
            - name: http
              containerPort: 8000
          resources:
            limits:
              nvidia.com/gpu: {{ $c.gpu }}
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
            failureThreshold: 90
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 10
          volumeMounts:
            - name: models
              mountPath: /models
            - name: shm             # vLLM은 공유 메모리를 많이 쓴다
              mountPath: /dev/shm
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llm-serving-models
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: llm-serving
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: llm-serving
spec:
  selector:
    app.kubernetes.io/name: llm-serving
  ports:
    - name: http
      port: 11434
      targetPort: http
{{- end }}
