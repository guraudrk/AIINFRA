{{- if .Values.webUi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-ui
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: web-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: web-ui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: web-ui
    spec:
      nodeSelector:
        node-role: app
      containers:
        - name: nginx
          image: {{ .Values.webUi.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits:   { cpu: 200m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-ui
  labels:
    {{- include "ai-platform.labels" . | nindent 4 }}
    app.kubernetes.io/name: web-ui
spec:
  selector:
    app.kubernetes.io/name: web-ui
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
